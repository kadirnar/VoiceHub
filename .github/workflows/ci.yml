name: Continuous Integration
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.ipynb'

  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.ipynb'

jobs:
  test:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Update pip
        run: python -m pip install --upgrade pip

      - name: Install package and test tools
        run: python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest

  training-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package, Torch, and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,training]"

      - name: Run gradient and checkpoint tests
        run: |
          python -c "import torch; print(torch.__version__)"
          python -m pytest

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Check pull request changes
        if: github.event_name == 'pull_request'
        run: >
          pre-commit run
          --from-ref ${{ github.event.pull_request.base.sha }}
          --to-ref ${{ github.event.pull_request.head.sha }}

      - name: Check pushed changes
        if: github.event_name == 'push'
        run: >
          pre-commit run
          --from-ref ${{ github.event.before }}
          --to-ref ${{ github.sha }}
