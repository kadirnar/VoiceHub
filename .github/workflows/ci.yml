name: Continuous Integration
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.ipynb'

  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.ipynb'

jobs:
  test:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Update pip
        run: python -m pip install --upgrade pip

      - name: Install the complete test environment
        run: |
          python -m pip install --upgrade uv
          uv pip install --system --torch-backend cpu -e ".[test]"

      - name: Resolve the complete default runtime
        run: >
          uv pip compile pyproject.toml
          --python-version ${{ matrix.python-version }}
          --torch-backend cpu
          --output-file voicehub-default.lock

      - name: Resolve the complete training runtime
        run: >
          uv pip compile pyproject.toml
          --extra training
          --python-version ${{ matrix.python-version }}
          --torch-backend cpu
          --output-file voicehub-training.lock

      - name: Run tests
        run: python -m pytest -q

  cross-platform-runtime-smoke:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install the complete default runtime
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system --torch-backend cpu -e ".[test]"

      - name: Import every default speech runtime
        env:
          VOICEHUB_FULL_RUNTIME_TEST: '1'
        run: python -m pytest -q tests/test_default_runtime_imports.py

  default-runtime-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install the complete default runtime
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system --torch-backend cpu -e ".[test]"

      - name: Run all inference, import, and contract tests
        env:
          VOICEHUB_FULL_RUNTIME_TEST: '1'
        run: python -m pytest -q

  training-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package, training runtime, and test tools
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system --torch-backend cpu -e ".[test,training]"

      - name: Run gradient and checkpoint tests
        run: |
          python -c "import torch; print(torch.__version__)"
          python -m pytest

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Check pull request changes
        if: github.event_name == 'pull_request'
        run: >
          pre-commit run
          --from-ref ${{ github.event.pull_request.base.sha }}
          --to-ref ${{ github.event.pull_request.head.sha }}

      - name: Check pushed changes
        if: github.event_name == 'push'
        run: >
          pre-commit run
          --from-ref ${{ github.event.before }}
          --to-ref ${{ github.sha }}
