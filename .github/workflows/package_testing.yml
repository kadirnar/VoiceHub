name: Package CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "from voicehub import AutoInferenceModel; assert len(AutoInferenceModel.available_models()) == 16"
