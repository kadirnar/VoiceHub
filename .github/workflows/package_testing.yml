name: Package CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build "nbformat>=5.10" numpy pytest soundfile uv
          python -m build

      - name: Verify source, documentation, and benchmark version alignment
        run: python scripts/check_release.py --dist-dir dist

      - name: Validate wheel, sdist, editable, provenance, and license data
        run: python scripts/check_distribution.py

      - name: Verify the dependency-free package surface
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "from voicehub import AutoInferenceModel; assert AutoInferenceModel.available_models()"

      - name: Install the declared wheel runtime
        run: uv pip install --system --torch-backend cpu dist/*.whl

      - name: Import every integration from the installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import importlib; from voicehub import list_model_specs; [importlib.import_module(name) for spec in list_model_specs(task=None) for name in (spec.config_module, spec.module)]"

      - name: Validate workflow documentation
        run: python -m pytest tests/test_documentation_site.py
