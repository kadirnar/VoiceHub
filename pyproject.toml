[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voicehub"
dynamic = ["version"]
description = "A unified, source-integrated inference interface for text-to-speech models"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "kadirnardev", email = "kadir.nar@hotmail.com" }]
keywords = ["text-to-speech", "tts", "speech", "voice-cloning", "transformers"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Typing :: Typed",
]
dependencies = [
  "huggingface-hub>=0.28",
  "numpy>=1.23",
  "soundfile>=0.12",
]

[project.urls]
Homepage = "https://github.com/kadirnar/VoiceHub"
Repository = "https://github.com/kadirnar/VoiceHub"
Issues = "https://github.com/kadirnar/VoiceHub/issues"
Documentation = "https://github.com/kadirnar/VoiceHub/tree/main/docs"

