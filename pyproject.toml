[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voicehub"
dynamic = ["version"]
description = "A unified inference and training interface for TTS, ASR, and VAD models"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "kadirnardev", email = "kadir.nar@hotmail.com" }]
keywords = [
  "automatic-speech-recognition",
  "speech",
  "text-to-speech",
  "transformers",
  "tts",
  "voice-activity-detection",
  "voice-cloning",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Typing :: Typed",
]
dependencies = [
  # One supported inference runtime for every built-in TTS, ASR, and VAD
  # backend. Training-only tooling intentionally lives in `voicehub[training]`.
  "torch>=2.8,<2.9",
  "torchaudio>=2.8,<2.9",
  "torchvision>=0.23,<0.24",
  "transformers>=5.3,<6",
  "accelerate>=1.0",
  "diffusers>=0.33",
  "huggingface-hub>=0.28",
  "peft>=0.18",
  "safetensors>=0.7",
  "sentencepiece",
  "tokenizers>=0.21",
  "torchtune>=0.6,<0.7",
  # Audio, signal processing, and portable serving.
  "argbind",
  "encodec",
  "ffmpeg-python",
  "librosa>=0.10",
  "numpy>=1.23",
  "onnx",
  "onnxruntime>=1.23",
  "polars",
  "pydub",
  "pyloudnorm",
  "scikit-learn",
  "scipy",
  "soundfile>=0.12",
  # Acoustic, codec, flow-matching, and language-model TTS runtimes.
  "absl-py",
  "anyascii",
  "apache-tvm-ffi",
  "cached-path",
  "cn2an",
  "coqpit>=0.0.16",
  "dacite",
  "einops",
  "einops-exts",
  "eng-to-ipa",
  "fast-langdetect",
  "gdown",
  "gruut[de,es,fr]",
  "gruut-ipa",
  "hangul-romanize",
  "hydra-core>1.3,<=1.3.2",
  "hyperpyyaml",
  "inflect>=7.5",
  "jamo",
  "jieba",
  "jieba-fast",
  "kanjize",
  "langid",
  "lightning>2.2.1,<=2.4.0",
  "local-attention",
  "loguru",
  "loralib",
  "matplotlib",
  "mecab-python3",
  "misaki[en,ja,zh]",
  "modelscope",
  "msgpack",
  "munch",
  "mutagen",
  "ninja",
  "nltk",
  "num2words",
  "numba>=0.61",
  "omegaconf<=2.3",
  "packaging",
  "pandas",
  "phonemizer",
  "pydantic",
  "pykakasi",
  "pypinyin",
  "pysbd",
  "pytorch-lightning",
  "pyyaml",
  "pyzmq",
  "regex",
  "requests",
  "rich",
  "rjieba",
  "sacremoses",
  "split-lang>=2,<3",
  "sudachidict-full",
  "sudachipy",
  "tiktoken",
  "torchdiffeq",
  "tqdm",
  "trainer",
  "unidecode",
  "uroman",
  "vector-quantize-pytorch",
  "wetext",
  "wget",
  "whisper-timestamped",
  "x-transformers",
  # Native speech-recognition and voice-activity-detection providers.
  "auditok>=0.5,<0.6",
  "cloudpickle",
  "faster-whisper>=1.1",
  "fiddle",
  "funasr",
  "nemo-toolkit[asr-only,common-only]==2.5.0",
  "openai-whisper",
  "protobuf>=5.29.5,<5.30",
  "pyannote.audio>=4,<5",
  "setuptools>=70,<74",
  "sherpa-onnx>=1.13,<1.14",
  "silero-vad",
  "speechbrain",
  "torchmetrics>=1.6.1",
  "webdataset>=0.2.86",
  "webrtcvad-wheels>=2.0.14",
  "whisperx>=3.8.7rc1,<3.9",
  "espnet==202511",
  "espnet-model-zoo>=0.1.7",
  # Pynini has no macOS or Windows wheels. Zonos falls back to its raw-text
  # normalizer there; Linux users receive the full normalizer by default.
  "pynini; platform_system == 'Linux' and platform_machine == 'x86_64'",
]

[project.urls]
Homepage = "https://github.com/kadirnar/voicehub"
Repository = "https://github.com/kadirnar/voicehub"
Issues = "https://github.com/kadirnar/voicehub/issues"
Documentation = "https://kadirnar.github.io/voicehub/"

[project.optional-dependencies]
docs = [
  "mkdocs-material==9.7.7",
  "mkdocs-static-i18n==1.3.1",
]
training = [
  "ema-pytorch",
  "datasets",
  "evaluate",
  "jiwer",
  "pyarrow",
  "pyworld",
  "wandb>=0.19",
]
test = [
  "nbformat>=5.10",
  "pre-commit",
  "pytest",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "voicehub.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["voicehub*"]
exclude = ["tests*"]
