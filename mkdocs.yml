site_name: VoiceHub Docs
site_description: Unified inference, data preparation, and training for modern TTS, ASR, and VAD models.
site_author: VoiceHub contributors
site_url: https://kadirnar.github.io/voicehub/
repo_url: https://github.com/kadirnar/voicehub
repo_name: kadirnar/voicehub
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true

theme:
  name: material
  language: en
  font: false
  custom_dir: overrides
  logo: assets/voicehub-mark.svg
  favicon: assets/voicehub-mark.svg
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - Quick Start:
      - Installation: getting-started/installation.md
      - First generation: getting-started/quickstart.md
  - Guides:
      - Overview: guides/index.md
      - TTS inference: guides/inference.md
      - Speech recognition: guides/speech-recognition.md
      - Voice activity detection: guides/voice-activity-detection.md
      - Data preparation: guides/data-preparation.md
      - ASR and VAD data: guides/speech-data.md
      - Training: guides/training.md
      - TTS optimization: guides/tts-optimization.md
      - Codec optimization: guides/codec-optimization.md
      - Diffusion and flow optimization: guides/diffusion-optimization.md
      - VITS-family optimization: guides/vits-optimization.md
      - LLM TTS serving: guides/llm-serving.md
      - TTS model benchmarks: guides/tts-model-benchmarks.md
      - RTX 4090 speech benchmarks: guides/rtx-4090-speech-benchmarks.md
      - RTX 5090 TTS benchmarks: guides/rtx-5090-tts-benchmarks.md
  - Notebooks: guides/notebook.md
  - Models:
      - TTS model catalog: models/index.md
      - TTS capabilities: models/tts-capabilities.md
      - ASR and VAD support: models/asr-vad-support.md
      - TTS training support: models/training-support.md
      - XTTS v2 native DVAE: models/xtts2.md
  - Architecture:
      - Library architecture: concepts/architecture.md
      - Trainer architecture: concepts/trainer.md
  - API Reference: reference/api.md
  - Contributing:
      - Add a TTS model: project/adding-a-model.md
      - Add an ASR or VAD provider: project/adding-speech-provider.md
      - Add an optimization: project/adding-an-optimization.md
      - Translations: project/translations.md
      - Model audit: project/model-audit.md

