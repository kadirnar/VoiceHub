site_name: VoiceHub Docs
site_description: Unified inference, data preparation, and training for modern text-to-speech models.
site_author: VoiceHub contributors
site_url: https://kadirnar.github.io/VoiceHub/
repo_url: https://github.com/kadirnar/VoiceHub
repo_name: kadirnar/VoiceHub
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true

theme:
  name: material
  language: en
  font: false
  custom_dir: overrides
  logo: assets/voicehub-mark.svg
  favicon: assets/voicehub-mark.svg
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Use light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Follow system preference
  features:
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - Get started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Workflows:
      - Overview: guides/index.md
      - Inference: guides/inference.md
      - Data preparation: guides/data-preparation.md
      - Training: guides/training.md
      - End-to-end notebook: guides/notebook.md
  - Models:
      - Model catalog: models/index.md
      - Training support: models/training-support.md
  - Concepts:
      - Library architecture: concepts/architecture.md
      - Trainer architecture: concepts/trainer.md
  - API reference: reference/api.md
  - Project:
      - Model audit: project/model-audit.md
      - Add a model: project/adding-a-model.md

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kadirnar/VoiceHub
      name: VoiceHub on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/voicehub/
      name: VoiceHub on PyPI

copyright: Copyright &copy; VoiceHub contributors

validation:
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: info
  links:
    not_found: warn
    absolute_links: relative_to_docs
    unrecognized_links: warn
    anchors: warn
