site_name: VoiceHub Docs
site_description: Unified inference, data preparation, and training for modern TTS, ASR, and VAD models.
site_author: VoiceHub contributors
site_url: https://kadirnar.github.io/voicehub/
repo_url: https://github.com/kadirnar/voicehub
repo_name: kadirnar/voicehub
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true

theme:
  name: material
  language: en
  font: false
  custom_dir: overrides
  logo: assets/voicehub-mark.svg
  favicon: assets/voicehub-mark.svg
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

nav:
  - Get started:
      - Overview: index.md
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Base classes:
      - Models:
          - Catalogs and support:
              - TTS model catalog: models/index.md
              - TTS capabilities: models/tts-capabilities.md
              - ASR and VAD support: models/asr-vad-support.md
              - XTTS v2 native DVAE: models/xtts2.md
          - Contribute:
              - Add a model: project/adding-a-model.md
              - Add an ASR or VAD provider: project/adding-speech-provider.md
              - Add an optimization: project/adding-an-optimization.md
      - Preprocessors:
          - Data preparation: guides/data-preparation.md
          - ASR and VAD data: guides/speech-data.md
      - Architecture:
          - Library architecture: concepts/architecture.md
          - Trainer architecture: concepts/trainer.md
  - Inference:
      - Overview: guides/index.md
      - Pipeline API:
          - Pipeline: guides/inference.md
          - Speech recognition: guides/speech-recognition.md
          - Voice activity detection: guides/voice-activity-detection.md
      - Serving:
          - LLM TTS serving: guides/llm-serving.md
  - Training:
      - Get started:
          - Trainer overview: guides/trainer.md
          - Fine-tuning: guides/training.md
      - Model support: models/training-support.md
  - Quantization and optimization:
