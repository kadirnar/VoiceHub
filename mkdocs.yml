markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/header-controls.js
  - javascripts/page-actions.js
  - javascripts/mobile-drawer.js

extra:
  docs_version:
    label: main
    release: "0.3.0"
    published: "0.1.6"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kadirnar/voicehub
      name: VoiceHub on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/voicehub/
      name: VoiceHub on PyPI

copyright: Copyright &copy; VoiceHub contributors

validation:
  nav:
